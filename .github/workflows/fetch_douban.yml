name: fetch douban
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0/3 * * *"

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: profile-repository-writes
  queue: max

jobs:
  douban:
    name: Douban mark data sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: movie
        uses: lizheming/doumark-action@b10baabac45771af497f1cf34d878fb3f952f9ff
        with:
          id: kaaaaai
          type: movie
          format: csv
          dir: ./data
      - name: music
        uses: lizheming/doumark-action@b10baabac45771af497f1cf34d878fb3f952f9ff
        with:
          id: kaaaaai
          type: music
          format: csv
          dir: ./data
      - name: book
        uses: lizheming/doumark-action@b10baabac45771af497f1cf34d878fb3f952f9ff
        with:
          id: kaaaaai
          type: book
          format: csv
          dir: ./data
      - name: Commit and push if changed
        run: |-
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add data/book.csv data/movie.csv data/music.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: sync douban mark data"
          git pull --rebase
          git push
