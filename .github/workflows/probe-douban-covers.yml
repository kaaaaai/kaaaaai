name: Probe Douban cover access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch representative cover images
        shell: python
        run: |
          import csv
          import pathlib
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          samples = {}
          for kind in ('book', 'movie', 'music'):
              with (pathlib.Path('data') / f'{kind}.csv').open(newline='') as source:
                  for row in csv.DictReader(source):
                      domain = urllib.parse.urlparse(row['poster']).hostname
                      if domain not in samples:
                          samples[domain] = (kind, row['poster'])

          passed = 0
          for domain, (kind, url) in samples.items():
              request = urllib.request.Request(
                  url, headers={'User-Agent': 'Mozilla/5.0', 'Referer': 'https://www.douban.com/'}
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      content_type = response.headers.get('Content-Type', '')
                      signature = response.read(16)
                      ok = response.status == 200 and content_type.startswith('image/') and bool(signature)
                      print(f'{kind} {domain}: HTTP {response.status}, {content_type}, image={ok}')
                      passed += ok
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as error:
                  print(f'{kind} {domain}: {error}')
          print(f'Accessible cover hosts: {passed}/{len(samples)}')
          # The proxy is known to fail; continue to test direct image discovery.
      - name: Resolve direct Douban covers
        shell: python
        run: |
          import json
          import sys
          import urllib.error
          import urllib.request

          headers = {'User-Agent': 'Mozilla/5.0', 'Referer': 'https://m.douban.com/'}
          passed = 0
          for kind, subject in (('book', '35494160'), ('movie', '37516455')):
              api = f'https://m.douban.com/rexxar/api/v2/{kind}/{subject}'
              try:
                  with urllib.request.urlopen(urllib.request.Request(api, headers=headers), timeout=20) as response:
                      cover = json.load(response)['cover_url']
                  with urllib.request.urlopen(urllib.request.Request(cover, headers=headers), timeout=20) as image:
                      content_type = image.headers.get('Content-Type', '')
                      ok = image.status == 200 and content_type.startswith('image/') and bool(image.read(16))
                      print(f'{kind}: API cover HTTP {image.status}, {content_type}, image={ok}')
                      passed += ok
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, KeyError) as error:
                  print(f'{kind}: API cover unavailable: {error}')
          print(f'Accessible direct covers: {passed}/2')
          sys.exit(0 if passed == 2 else 1)
