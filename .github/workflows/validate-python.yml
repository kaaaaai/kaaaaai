name: Validate Python automation

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: '**/requirements*.txt'

      - name: Verify dependencies and scripts
        run: |
          python -m pip install -r requirements-readme.txt -r requirements-automation.txt
          python -m pip check
          python -c 'import build_readme, requests, dotenv'
          python -m compileall -q build_readme.py fetch_memos.py fetch_wakatime.py memos.py
