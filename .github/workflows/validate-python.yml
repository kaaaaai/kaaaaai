name: Validate Python automation

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: '**/requirements*.txt'

      - name: Verify dependencies and scripts
        run: |
          python -m pip install -r requirements-readme.txt -r requirements-automation.txt
          python -m pip check
          python -c 'import build_readme, requests, dotenv'
          python -m compileall -q build_readme.py fetch_memos.py fetch_wakatime.py memos.py
